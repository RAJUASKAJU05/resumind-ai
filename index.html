<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resumind AI</title>
<style>
:root{
  --bg:#FAF8F3;--card:#fff;--ink:#1C1B19;--mut:#716C5F;--line:#E5E0D4;
  --ac:#B23A2E;--ok:#2F6B4F;--bad:#B23A2E;--nav:#1C1B19;--ring:#B23A2E;
  --mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#17160F;--card:#201F19;--ink:#F3EFE4;--mut:#9C9586;--line:#332F26;
  --ac:#E2756A;--ok:#5FB98A;--bad:#E2756A;--nav:#0F0E0A;--ring:#E2756A
}}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;font:16px/1.55 -apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2{font-family:var(--mono);font-weight:600;letter-spacing:-.01em}
h1{font-size:28px;margin:0 0 14px}h2{font-size:16px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--mut)}

header{background:var(--nav);color:#fff;display:flex;align-items:center;gap:4px;padding:16px 24px}
header b{font-family:var(--mono);font-size:16px;margin-right:auto;letter-spacing:-.02em}
header button{background:none;border:0;color:#D8D3C4;padding:8px 12px;cursor:pointer;font:14px/1 inherit;border-bottom:2px solid transparent}
header button:hover,header button.on{color:#fff;border-bottom-color:var(--ac)}

main{max-width:960px;margin:0 auto;padding:28px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:22px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{font-family:var(--mono);font-size:32px;font-weight:600}.mut{color:var(--mut);font-size:13px}

button{font:15px/1 inherit;cursor:pointer;border-radius:2px}
button.p{background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:11px 20px;transition:opacity .15s}
button.p:hover{opacity:.82}button.p:disabled{opacity:.4;cursor:default}
button.s{background:none;border:1px solid var(--line);color:var(--ink);padding:9px 16px;transition:border-color .15s}
button.s:hover{border-color:var(--ink)}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);font:15px/1 inherit;margin-bottom:10px}
input:focus-visible,textarea:focus-visible,:focus-visible{outline:2px solid var(--ac);outline-offset:1px}

.drop{border:1px dashed var(--line);border-radius:3px;padding:48px 20px;text-align:center;cursor:pointer;transition:border-color .15s}
.drop:hover,.drop.over{border-color:var(--ac);border-style:solid}

.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.chip{display:inline-block;padding:3px 10px;border-radius:2px;background:var(--bg);border:1px solid var(--line);margin:2px;font:13px var(--mono)}
.chip.g{color:var(--ok);border-color:var(--ok)}.chip.r{color:var(--bad);border-color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width 1s var(--ease)}
.err{color:var(--bad);margin:6px 0;font-size:14px}
.pass{color:var(--ok)}.fail{color:var(--bad)}
pre{white-space:pre-wrap;font:14px/1.5 inherit;margin:0}
.msg{padding:9px 13px;border-radius:2px;margin:6px 0;max-width:85%}
.u{background:var(--ink);color:var(--bg);margin-left:auto}.a{background:var(--bg);border:1px solid var(--line)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pulse{50%{opacity:.5}}
#app>*{animation:fadeUp .4s var(--ease) both}
.err{animation:shake .4s}
.sk{height:15px;border-radius:2px;margin:9px 0;background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}

.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;max-width:900px;margin:24px auto 8px;padding:0}
.hero h1{font-size:clamp(30px,4.6vw,46px);line-height:1.12;margin:0 0 18px}
.hero p{font-size:16px;color:var(--mut);max-width:40ch;margin:0 0 26px}
.stage{perspective:1400px;display:flex;justify-content:center;padding:20px 0}
.sheet{width:220px;height:290px;background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:26px 22px;transform-style:preserve-3d;transform:rotateY(-22deg) rotateX(4deg);
  box-shadow:28px 20px 50px -20px rgba(0,0,0,.35);animation:rotate3d 10s ease-in-out infinite;
  display:flex;flex-direction:column;gap:9px}
@keyframes rotate3d{0%,100%{transform:rotateY(-22deg) rotateX(4deg)}50%{transform:rotateY(14deg) rotateX(-2deg)}}
.sheet .ln{height:7px;background:var(--line);border-radius:1px;width:100%}
.sheet .ln.s{width:60%}
.sheet .mark{display:flex;align-items:center;gap:8px;margin-top:4px}
.sheet .mark .ln{flex:1}
.sheet .mark.bad .ln{background:var(--bad);opacity:.35}
.sheet .mark.bad::after{content:"✕";color:var(--bad);font:13px var(--mono)}
.sheet .mark.good::after{content:"✓";color:var(--ok);font:13px var(--mono)}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:left}.stage{order:-1;padding:0 0 10px}.sheet{width:170px;height:224px;padding:18px}}

.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px}
.step{padding:6px 12px;border:1px solid var(--line);border-radius:2px;font:13px var(--mono);color:var(--mut)}
.feat{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);margin:34px 0;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.feat .card{margin:0;border:0;border-radius:0;background:var(--card)}
.ico{font-size:22px}
.faq summary{cursor:pointer;font-weight:600;padding:10px 0}
.faq details{border-top:1px solid var(--line)}
.faq details[open]>p{animation:fadeUp .3s var(--ease)}

.ring{width:100px;height:100px;display:block;margin:0 auto 6px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .t{stroke:var(--line)}.ring .v{stroke:var(--ring);stroke-dasharray:283;stroke-dashoffset:283;transition:stroke-dashoffset 1.1s var(--ease)}
.ringwrap{position:relative;text-align:center}.ringwrap .stat{position:absolute;top:28px;left:0;right:0;font-size:28px}

#burger{display:none;background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:4px 10px}
@media(max-width:640px){
  #burger{display:block}
  #nav{visibility:hidden;position:fixed;top:0;right:0;bottom:0;width:220px;background:var(--nav);display:flex;flex-direction:column;padding:70px 16px;gap:4px;transform:translateX(100%);transition:transform .3s var(--ease);z-index:50}
  #nav.open{visibility:visible;transform:none;box-shadow:-10px 0 30px #0007}
  header{padding:12px 16px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

.flow{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:4px 2px 12px}
.fs{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--mut);font:12px var(--mono);cursor:pointer;min-width:72px}
.fs span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);font-weight:600}
.fs.done span{background:var(--ink);border-color:var(--ink);color:var(--bg)}.fs.done{color:var(--ink)}
.fs.next span{border-color:var(--ac);color:var(--ac);animation:pulse 1.8s ease-in-out infinite}
.ln{flex:1;height:1px;min-width:12px;background:var(--line)}
.board{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:start}
.col{padding:12px}
.app{border:1px solid var(--line);border-radius:2px;padding:10px;margin:8px 0;background:var(--bg)}
.app select{padding:4px;margin-top:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:2px}
</style></head><body>
<header><b>Resumind AI</b><button id="burger" aria-label="Menu">☰</button><span id="nav"></span></header><main id="app" aria-live="polite"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');let ME=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){const r=await fetch('/api'+p,{credentials:'same-origin',...o});if(r.status===204)return null;
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:Array.isArray(d.detail)?d.detail.map(x=>{const f=String(x.loc?.slice(-1)[0]||'input').replace('_',' ');return f[0].toUpperCase()+f.slice(1)+': '+x.msg.replace(/^String should have at least 1 characters?/,'is required').replace(/^String should have at least (\d+) characters?/,'must be at least $1 characters').replace(/^Field required/,'is required')}).join('. '):'Please check your input and try again.');return d}
const J=(m,b)=>({method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
function nav(){$('#nav').innerHTML=ME?['dashboard:Dashboard','upload:Upload','jobs:Job match','gaps:Skill gaps','interview:Interview','apps:Applications','chat:Assistant'].map(x=>{const[k,l]=x.split(':');return`<button onclick="go('${k}')">${l}</button>`}).join('')+`<button onclick="logout()">Log out</button>`:''}
function go(v,a){nav();$('#nav').classList.remove('open');({auth,dashboard,upload,jobs,chat,detail,gaps,interview,apps})[v](a)}
async function logout(){await api('/auth/logout',{method:'POST'});ME=null;go('auth')}
async function auth(reg){app.innerHTML=`${reg?'':`<div class="hero"><div><h1>Know exactly what's wrong with your resume.</h1>
<p>Upload a PDF, Word file or scanned image. Resumind AI runs the same checks a hiring system does, finds skill gaps against any job post, and helps you fix weak lines without inventing anything.</p></div>
<div class="stage"><div class="sheet"><div class="ln" style="width:70%"></div><div class="ln s"></div><div class="ln" style="margin-top:10px"></div><div class="ln" style="width:85%"></div><div class="mark bad"><div class="ln"></div></div><div class="ln" style="width:55%"></div><div class="mark good"><div class="ln"></div></div><div class="ln" style="width:75%"></div></div></div></div>`}
<div class="card" style="max-width:420px;margin:${reg?'30px':'34px'} auto"><h1>${reg?'Create account':'Log in'}</h1>
<p class="mut">Upload your resume, see how it reads to ATS software, and compare it to a job. Your resumes are private to your account and you can delete them any time. AI suggestions should be reviewed before you use them.</p>
<form id="f">${reg?'<label>Name<input name="name" required></label>':''}<label>Email<input name="email" type="email" required></label>
<label>Password${reg?' (8+ characters)':''}<input name="password" type="password" minlength="${reg?8:1}" required></label>
${reg?'<label id="caplbl">Quick check, loading…<input name="captcha_answer" id="capans" inputmode="numeric" required></label><input type="hidden" name="captcha_token" id="captok"><div style="position:absolute;left:-9999px" aria-hidden="true"><label>Leave this field blank<input name="website" id="hp" tabindex="-1" autocomplete="off"></label></div>':''}
<div class="err" id="e"></div>
<button class="p">${reg?'Create account':'Log in'}</button> <button type="button" class="s" onclick="auth(${!reg})">${reg?'I have an account':'Create an account'}</button>${reg?'':' <button type="button" class="s" onclick="reset()">Forgot password</button>'}</form></div>${reg?'':LANDING}`;
if(reg)loadCaptcha();
$('#f').onsubmit=async e=>{e.preventDefault();try{ME=await api(reg?'/auth/register':'/auth/login',J('POST',Object.fromEntries(new FormData(e.target))));go('dashboard')}catch(x){$('#e').textContent=x.message;if(reg)loadCaptcha()}}}
async function loadCaptcha(){try{const cap=await api('/auth/captcha');$('#caplbl').childNodes[0].textContent=`Human check: ${cap.question} `;$('#captok').value=cap.token;$('#capans').value=''}catch{}}
const LANDING=`<div class="steps">${['Upload','Extract','Analyze','Match a job','Improve'].map((x,i)=>`<span class="step">${i+1}. ${x}</span>`).join('<span class="mut">→</span>')}</div>
<div class="feat">${[['🔍','ATS check','Rule-based checks on headings, tables, symbols and contact details.'],['📄','PDF, DOCX, scans','Text files are parsed directly; images and scans use OCR.'],['🎯','Job match','See matching skills and gaps against any pasted job description.'],['✨','AI rewrite','Reword weak lines. Nothing is invented; you review every change.']].map(([i,t,d])=>`<div class="card"><span class="ico">${i}</span><h2>${t}</h2><p class="mut">${d}</p></div>`).join('')}</div>
<div class="card faq"><h2>Questions</h2><details><summary>Is my resume kept private?</summary><p class="mut">It is stored only to analyze it for you and is visible only to your account. You can delete any resume, or your whole account, at any time.</p></details>
<details><summary>Does a high ATS score guarantee anything?</summary><p class="mut">No. It is an internal compatibility indicator, not a guarantee that any specific hiring system will accept your resume.</p></details>
<details><summary>Can the AI make things up?</summary><p class="mut">It is instructed not to invent experience or numbers, but AI suggestions can still be wrong. Review them before using them.</p></details></div>`;
function reset(){app.innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><h1>Reset password</h1><p class="mut">Ask your administrator for the reset code.</p><form id="f"><input name="email" type="email" placeholder="Email" required><input name="new_password" type="password" minlength="8" placeholder="New password (8+ characters)" required><input name="code" placeholder="Reset code" required><div class="err" id="e"></div><button class="p">Reset password</button> <button type="button" class="s" onclick="auth()">Back</button></form></div>`;
$('#f').onsubmit=async e=>{e.preventDefault();try{await api('/auth/reset-password',J('POST',Object.fromEntries(new FormData(e.target))));auth()}catch(x){$('#e').textContent=x.message}}}
const stepper=(fl,nx)=>`<div class="card"><h2>Your flow</h2><div class="flow">${fl.map((x,i)=>`<button class="fs ${x.done?'done':''} ${i===nx?'next':''}" onclick="go('${x.view}')"><span>${x.done?'✓':i+1}</span>${x.label}</button>`).join('<i class="ln"></i>')}</div><p class="mut">${nx<0?'You have completed every step.':'Next: '+fl[nx].label+'.'} Steps tick off from your real activity. <i>Improve</i> needs the AI key.</p></div>`;
async function dashboard(){app.innerHTML='<div class="card"><div class="sk" style="width:35%"></div><div class="sk"></div><div class="sk" style="width:70%"></div></div>';const [rs,fl]=await Promise.all([api('/resumes'),api('/flow')]);const best=rs[0];const nx=fl.findIndex(x=>!x.done);
app.innerHTML=`<h1>Hi ${esc(ME.name)}</h1>${stepper(fl,nx)}<div class="grid"><div class="card"><div class="stat">${best?best.overall:'–'}</div><div class="mut">Latest overall score</div></div>
<div class="card"><div class="stat">${best?best.ats:'–'}</div><div class="mut">Latest ATS score</div></div><div class="card"><div class="stat">${rs.length}</div><div class="mut">Resumes saved</div></div></div>
<div class="card"><h2>Your resumes</h2>${rs.length?rs.map(r=>`<div class="row"><span><b>${esc(r.filename)}</b><br><span class="mut">${esc(r.created)}</span></span><span>Score ${r.overall} · ATS ${r.ats}</span>
<span><button class="s" onclick="go('detail',${r.id})">View</button> <button class="s" onclick="ren(${r.id},'${esc(r.filename).replace(/'/g,'')}')">Rename</button> <button class="s" onclick="dup(${r.id})">Duplicate</button> <button class="s" onclick="cmp(${r.id})">Compare</button> <button class="s" onclick="del(${r.id})">Delete</button></span></div>`).join('')
:'<p>No resumes yet. Upload your first resume and Resumind AI will analyze it.</p><button class="p" onclick="go(\'upload\')">Upload resume</button>'}</div><div class="card"><h2>Your data</h2><p class="mut">Resumes are stored only to analyze them for you. You can delete any resume above, or delete your whole account and everything in it.</p><button class="s" onclick="delAcc()">Delete my account</button></div><div class="card"><h2>Security log</h2><p class="mut">Recent sign-ins and account changes, visible only to you.</p><button class="s" id="seclog-btn" onclick="showSecLog()">Show recent activity</button><div id="seclog"></div></div>`}
async function showSecLog(){const el=$('#seclog');el.innerHTML='<div class="sk"></div>';const rows=await api('/auth/security-log');
el.innerHTML=rows.length?rows.map(r=>`<div class="row" style="border-top:1px solid var(--line);padding:8px 0"><b>${esc(r.event.replace(/_/g,' '))}</b><br><span class="mut">${esc(r.created)} · ${esc(r.ip||'unknown IP')}${r.detail?' · '+esc(r.detail):''}</span></div>`).join(''):'<p class="mut">No activity recorded yet.</p>'}
async function dup(id){await api(`/resumes/${id}/duplicate`,{method:'POST'});dashboard()}
async function delAcc(){if(confirm('Permanently delete your account and all resumes?')){await api('/auth/account',{method:'DELETE'});ME=null;go('auth')}}
async function cmp(id){const rs=await api('/resumes'),o=rs.filter(r=>r.id!=id);if(!o.length)return alert('Upload or duplicate another resume to compare.');
 const pick=prompt('Compare with which resume number?\n'+o.map((r,i)=>`${i+1}. ${r.filename}`).join('\n'),'1');const b=o[(+pick||0)-1];if(!b)return;
 const m=await api(`/resumes/${id}/compare/${b.id}`),ch=(a,c)=>a.map(x=>`<span class="chip ${c}">${esc(x)}</span>`).join('')||'<span class="mut">none</span>';
 app.innerHTML=`<h1>Compare</h1><div class="grid"><div class="card"><h2>${esc(m.a.name)}</h2><div class="stat">${m.a.overall_score}</div><div class="mut">Overall · ATS ${m.a.ats_score}</div></div><div class="card"><h2>${esc(m.b.name)}</h2><div class="stat">${m.b.overall_score}</div><div class="mut">Overall · ATS ${m.b.ats_score}</div></div></div>
 <div class="card"><h2>Only in first</h2>${ch(m.only_in_a,'g')}<h2>Only in second</h2>${ch(m.only_in_b,'g')}<h2>In both</h2>${ch(m.shared,'')}</div><button class="s" onclick="go('dashboard')">Back</button>`}
async function ren(id,n){const v=prompt('New name',n);if(v){await api('/resumes/'+id,J('PATCH',{filename:v}));dashboard()}}
async function del(id){if(confirm('Delete this resume and its analysis permanently?')){await api('/resumes/'+id,{method:'DELETE'});dashboard()}}
function upload(){app.innerHTML=`<h1>Upload resume</h1><div class="card"><label class="drop" id="d" tabindex="0">Drop a PDF, DOCX, PNG or JPG here (scans are read with OCR), or click to browse. Max 5 MB.<input id="fi" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg" hidden></label><div id="st" class="mut" style="margin-top:12px"></div><div class="err" id="e"></div></div>`;
const d=$('#d'),fi=$('#fi');d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();send(e.dataTransfer.files[0])};
d.onkeydown=e=>e.key==='Enter'&&fi.click();fi.onchange=()=>send(fi.files[0]);
async function send(f){if(!f)return;$('#e').textContent='';$('#st').innerHTML='<div class="sk"></div><div class="sk" style="width:60%"></div>Uploading, extracting and analyzing…';const fd=new FormData();fd.append('file',f);
 try{const r=await api('/resumes/upload',{method:'POST',body:fd});go('detail',r.id)}catch(x){$('#st').textContent='';$('#e').innerHTML=esc(x.message)+' <button class="s" onclick="upload()">Try again</button>'}}}
const bar=(l,v)=>`<div style="margin:8px 0"><div class="row" style="border:0;padding:0"><span>${l}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`;
const ring=v=>`<svg class="ring" viewBox="0 0 110 110"><defs><linearGradient id="rg"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><circle class="t" cx="55" cy="55" r="46"/><circle class="v" cx="55" cy="55" r="46" data-v="${v}"/></svg><div class="stat" data-n="${v}">0</div>`;
async function detail(id){app.innerHTML='<div class="card"><div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk" style="width:80%"></div></div>';const r=await api('/resumes/'+id),a=r.analysis,p=r.parsed;
app.innerHTML=`<h1>${esc(r.filename)}</h1><div class="grid"><div class="card ringwrap">${ring(a.overall_score)}<div class="mut">Overall score</div></div><div class="card ringwrap">${ring(a.ats_score)}<div class="mut">ATS compatibility</div></div></div>
<div class="card"><h2>Score breakdown</h2>${Object.entries(a.scores).map(([k,v])=>bar(k[0].toUpperCase()+k.slice(1),v)).join('')}<p class="mut">${esc(a.note)} Scores follow fixed rules (shown below), not a guarantee of results.</p></div>
<div class="card"><h2>Recommendations</h2>${a.recommendations.length?'<ul>'+a.recommendations.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<p>No rule-based issues found.</p>'}</div>
<div class="card"><h2>ATS checks</h2>${a.ats_checks.map(c=>`<div class="${c.pass?'pass':'fail'}">${c.pass?'✓':'✗'} ${esc(c.label)}</div>`).join('')}</div>
<div class="card"><h2>Detected skills</h2>${p.skills.map(s=>`<span class="chip">${esc(s)}</span>`).join('')||'None recognised'}
<p class="mut">Contact: ${esc(p.email||'no email')} · ${esc(p.phone||'no phone')}</p></div>
<div class="card"><h2>AI review</h2><button class="p" id="rv">Get AI review</button><pre id="ro" style="margin-top:10px"></pre></div>
<div class="card"><h2>Improve a line</h2><textarea id="it" rows="3" placeholder="Paste a bullet or summary from your resume"></textarea><button class="p" id="ib">Improve</button>
<div id="io" style="margin-top:10px"></div></div>`;
$('#rv').onclick=async e=>{e.target.disabled=true;$('#ro').textContent='Thinking…';try{$('#ro').textContent=(await api(`/resumes/${id}/ai-review`,{method:'POST'})).review}catch(x){$('#ro').innerHTML=`<span class="err">${esc(x.message)}</span>`}e.target.disabled=false};
$('#ib').onclick=async()=>{const t=$('#it').value;if(!t)return;$('#io').textContent='Thinking…';try{const o=(await api('/ai/improve',J('POST',{text:t}))).improved;
 $('#io').innerHTML=`<pre>${esc(o)}</pre><p class="mut">Check this is accurate before using it.</p><button class="s" id="cp">Copy</button> <button class="s" onclick="$('#ib').click()">Regenerate</button> <button class="s" onclick="$('#io').innerHTML=''">Reject</button>`;
 $('#cp').onclick=()=>navigator.clipboard.writeText(o)}catch(x){$('#io').innerHTML=`<span class="err">${esc(x.message)}</span>`}}}

const sel=(id,items,f)=>`<select id="${id}" style="padding:8px;max-width:100%">${items.map(f).join('')}</select>`;
async function gaps(){app.innerHTML='<div class="card"><div class="sk" style="width:40%"></div><div class="sk"></div></div>';const g=await api('/skill-gaps');
app.innerHTML=`<h1>Skill gaps</h1><div class="card">${g.length?g.map(x=>`<div class="row"><span><b>${esc(x.skill)}</b> <span class="mut">asked for in ${x.jobs} job${x.jobs>1?'s':''}: ${x.job_titles.map(esc).join(', ')}</span><br><span class="mut">${esc(x.tip)}</span></span></div>`).join('')
:'<p>No gaps yet. Save a job and match it against a resume first.</p><button class="p" onclick="go(\'jobs\')">Match a job</button>'}</div><p class="mut">Gaps come from keyword matching, so a skill you described in different words may show up here. Check each one honestly.</p>`}
async function interview(){const [rs,js]=await Promise.all([api('/resumes'),api('/jobs')]);
if(!rs.length){app.innerHTML='<h1>Practice interview</h1><div class="card"><p>Upload a resume first. Questions are built from it.</p><button class="p" onclick="go(\'upload\')">Upload resume</button></div>';return}
app.innerHTML=`<h1>Practice interview</h1><div class="card"><p class="mut">Pick a resume and (optionally) a job. Questions come from your resume and the job's skill gaps. Answers are scored with simple rules (length, action, result, numbers), plus AI comments when the AI key is set. It is practice, not a prediction.</p>
${sel('ir',rs,r=>`<option value="${r.id}">${esc(r.filename)}</option>`)} ${sel('ij',[{id:'',title:'No specific job'},...js],j=>`<option value="${j.id}">${esc(j.title)}</option>`)} <button class="p" id="iq">Get questions</button><div id="iq-o"></div></div>`;
$('#iq').onclick=async()=>{const b=$('#iq');b.disabled=true;try{const q=await api('/interview/questions',J('POST',{resume_id:+$('#ir').value,job_id:$('#ij').value?+$('#ij').value:null}));let i=0;
 const show=()=>{$('#iq-o').innerHTML=`<h2 style="margin-top:16px">Question ${i+1} of ${q.questions.length} <span class="mut">(${q.source=='ai'?'AI-written':'from your resume'})</span></h2><p><b>${esc(q.questions[i])}</b></p><textarea id="ia" rows="5" placeholder="Type your answer as you would say it"></textarea><button class="p" id="is">Get feedback</button> <button class="s" id="in">Skip</button><div id="fb"></div>`;
  $('#in').onclick=()=>{i=(i+1)%q.questions.length;show()};
  $('#is').onclick=async()=>{const a=$('#ia').value.trim();if(!a)return;try{const f=await api('/interview/feedback',J('POST',{question:q.questions[i],answer:a}));
   $('#fb').innerHTML=`<div class="stat" style="margin-top:10px">${f.score}<span class="mut" style="font-size:15px"> / 100 · ${f.words} words</span></div>${f.tips.length?'<ul>'+f.tips.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p>Good structure. Keep it natural.</p>'}${f.ai_feedback?`<h2>AI comments</h2><pre>${esc(f.ai_feedback)}</pre>`:''}<button class="s" onclick="document.getElementById('in').click()">Next question</button>`}catch(x){$('#fb').innerHTML=`<div class="err">${esc(x.message)}</div>`}}};show()}catch(x){$('#iq-o').innerHTML=`<div class="err">${esc(x.message)}</div>`}b.disabled=false}}
const ST=['Saved','Applied','Interview','Offer','Rejected'];
async function apps(){const [as,rs,js]=await Promise.all([api('/applications'),api('/resumes'),api('/jobs')]);
app.innerHTML=`<h1>Applications</h1><div class="card"><h2>Add application</h2><div class="grid"><input id="ac" placeholder="Company"><input id="ar" placeholder="Role"></div>
${sel('as',ST.map(x=>({id:x})),x=>`<option>${x.id}</option>`)} ${rs.length?sel('arr',[{id:'',filename:'Resume used (optional)'},...rs],r=>`<option value="${r.id}">${esc(r.filename)}</option>`):''} ${js.length?sel('aj',[{id:'',title:'Job (optional)'},...js],j=>`<option value="${j.id}">${esc(j.title)}</option>`):''}
<textarea id="an" rows="2" placeholder="Notes (optional)" style="margin-top:10px"></textarea><div class="err" id="e"></div><button class="p" id="aa">Add</button></div>
<div class="board">${ST.map(st=>`<div class="card col"><h2>${st} <span class="mut">${as.filter(a=>a.status==st).length}</span></h2>${as.filter(a=>a.status==st).map(a=>`<div class="app"><b>${esc(a.company)}</b><br><span class="mut">${esc(a.role)}</span>${a.notes?`<br><span class="mut">${esc(a.notes)}</span>`:''}<br>
<select onchange="mv(${a.id},this.value)" aria-label="Move ${esc(a.company)}">${ST.map(x=>`<option ${x==st?'selected':''}>${x}</option>`).join('')}</select> <button class="s" onclick="rmApp(${a.id})" aria-label="Delete">✕</button></div>`).join('')||'<p class="mut">Empty</p>'}</div>`).join('')}</div>`;
$('#aa').onclick=async()=>{try{await api('/applications',J('POST',{company:$('#ac').value,role:$('#ar').value,status:$('#as').value,notes:$('#an').value,resume_id:$('#arr')?.value?+$('#arr').value:null,job_id:$('#aj')?.value?+$('#aj').value:null}));apps()}catch(x){$('#e').textContent=x.message}}}
async function mv(id,st){await api('/applications/'+id,J('PATCH',{status:st}));apps()}
async function rmApp(id){if(confirm('Delete this application?')){await api('/applications/'+id,{method:'DELETE'});apps()}}
async function jobs(){const [rs,js]=await Promise.all([api('/resumes'),api('/jobs')]);
app.innerHTML=`<h1>Job match</h1><div class="card"><h2>Add a job</h2><input id="jt" placeholder="Job title"><textarea id="jd" rows="6" placeholder="Paste the job description"></textarea><div class="err" id="e"></div><button class="p" id="ja">Save job</button></div>
<div class="card"><h2>Match</h2>${rs.length&&js.length?`<select id="rs" style="padding:8px">${rs.map(r=>`<option value="${r.id}">${esc(r.filename)}</option>`).join('')}</select> <select id="js" style="padding:8px">${js.map(j=>`<option value="${j.id}">${esc(j.title)}</option>`).join('')}</select> <button class="p" id="jm">Compare</button><div id="mo"></div>`:'<p>Upload a resume and save a job to compare them.</p>'}</div>`;
$('#ja').onclick=async()=>{try{await api('/jobs',J('POST',{title:$('#jt').value,description:$('#jd').value}));jobs()}catch(x){$('#e').textContent=x.message}};
if($('#jm'))$('#jm').onclick=async()=>{const m=await api(`/jobs/${$('#js').value}/match?resume_id=${$('#rs').value}`,{method:'POST'});const ch=(a,c)=>a.map(s=>`<span class="chip ${c}">${esc(s)}</span>`).join('')||'<span class="mut">none</span>';
 $('#mo').innerHTML=`<div class="stat">${m.score}%</div><div class="mut">Confidence: ${esc(m.confidence)}</div><h2>Matching skills</h2>${ch(m.matching_skills,'g')}<h2>Potential gaps</h2>${ch(m.missing_skills,'r')}<h2>Keywords to consider</h2>${ch(m.missing_keywords,'r')}<p class="mut">${esc(m.note)}</p>`}}
function chat(){app.innerHTML=`<h1>Career assistant</h1><div class="card"><div id="log"><p class="mut">Ask about skills to learn, your summary, or how to improve a bullet.</p></div><form id="cf" style="display:flex;gap:8px;margin-top:10px"><input id="cm" placeholder="Ask a question" style="margin:0"><button class="p">Send</button></form></div>`;
api('/ai/history').then(h=>{if(h.length)$('#log').innerHTML=h.map(x=>`<div class="msg ${x.role=='user'?'u':'a'}"><pre>${esc(x.content)}</pre></div>`).join('')});
$('#cf').onsubmit=async e=>{e.preventDefault();const m=$('#cm').value;if(!m)return;$('#cm').value='';const L=$('#log');L.insertAdjacentHTML('beforeend',`<div class="msg u">${esc(m)}</div>`);
 try{const rs=await api('/resumes');const r=await api('/ai/chat',J('POST',{message:m,resume_id:rs[0]?.id??null}));L.insertAdjacentHTML('beforeend',`<div class="msg a"><pre>${esc(r.reply)}</pre></div>`)}catch(x){L.insertAdjacentHTML('beforeend',`<div class="err">${esc(x.message)}</div>`)}}}

/* ---------- data-reveal motion only: nothing decorative ---------- */
function counter(el,to,suf=''){el.textContent=0;const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suf;if(p<1)requestAnimationFrame(f)})(t0)}
function enhance(){
 document.querySelectorAll('#app .stat[data-n]:not(.dn)').forEach(e=>{e.classList.add('dn');counter(e,+e.dataset.n)});
 document.querySelectorAll('#app .stat:not(.dn):not([data-n])').forEach(e=>{e.classList.add('dn');const n=parseFloat(e.textContent);if(!isNaN(n))counter(e,n,e.textContent.replace(/[\d.]/g,''))});
 requestAnimationFrame(()=>{document.querySelectorAll('.bar i:not(.g)').forEach(b=>{b.classList.add('g');const w=b.style.width;b.style.width='0';setTimeout(()=>b.style.width=w,60)});
  document.querySelectorAll('.ring .v:not(.g)').forEach(r=>{r.classList.add('g');setTimeout(()=>r.style.strokeDashoffset=283-283*(+r.dataset.v/100),60)})});
}
new MutationObserver(()=>enhance()).observe(app,{childList:true,subtree:true});
$('#burger').onclick=()=>$('#nav').classList.toggle('open');
enhance();
(async()=>{try{ME=await api('/auth/me');go('dashboard')}catch{go('auth')}})();
</script></body></html>
